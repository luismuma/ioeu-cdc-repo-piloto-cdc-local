[defaults]
stdout_callback   = yaml
bin_ansible_callbacks = true

[ssh_connection]
# Avoids the "Failed to change ownership of the temporary files" error when
# becoming from ec2-user to an unprivileged user (e.g. oracle).
# Pipelining sends module code over stdin — no temp file is written to disk,
# so no chmod/setfacl is needed.
# Requires that 'requiretty' is NOT set in /etc/sudoers on the target hosts.
pipelining = true
