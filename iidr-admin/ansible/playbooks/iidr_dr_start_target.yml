---
## Arranque de servicios IIDR en la ubicación destino (AZ-A, AZ-B o DR).
##
## Parte del rediseño del switch DR (2026-09-22). El switch real ya NO es un
## único playbook automatizado: entre la parada y el arranque hay pasos MANUALES
## (petición de cambio de DNS ~1h + cambio del sentido de replicación del EFS).
## Por eso el switch se parte en dos operaciones:
##   1. PARADA de servicios en todas las ubicaciones  ← iidr_dr_stop_all.yml
##   2. (manual) cambio de DNS + (manual) sentido EFS
##   3. ARRANQUE de servicios en el target            ← este playbook
##
## Este playbook NO toca /etc/hosts (el DNS es ahora una petición real, ya no se
## emula) y NO gestiona suscripciones (solo los servicios systemctl). Arranca en
## la ÚNICA ubicación destino indicada por iidr_dr_target_location, tomando el
## grupo de inventario correspondiente (igual que hacía iidr_dr_switch.yml).
##
## NO sustituye ni borra iidr_dr_switch.yml — convive con él. Es el gemelo de
## arranque de iidr_dr_stop_all.yml (ambos por grupos de inventario).
##
## Required extra-vars (AAP extra vars / prompt on launch):
##   iidr_env                 - normalmente 'prod' (DR solo existe para producción).
##   iidr_dr_target_location  - 'a' | 'b' | 'dr' — ubicación donde arrancar.
##
## Inventario requerido en AAP (grupos reales, igual que iidr_dr_switch.yml):
##   [iidr_az_a_<env>]  AS+DB2+Kafka de AZ-A Irlanda
##   [iidr_az_b_<env>]  AS+DB2+Kafka de AZ-B Irlanda
##   [iidr_dr_<env>]    AS+DB2+Kafka de Frankfurt (región DR)
##
## Job Template AAP: inventario real con esos grupos, Machine Credential
## (ec2-user con sudo NOPASSWD). SIN credencial AWS SM. Sin "Enable privilege
## escalation" (escala por tarea con become: true).

- name: Arrancar servicios IIDR en la ubicación destino
  hosts: >-
    {{ 'iidr_az_a_' ~ iidr_env if iidr_dr_target_location == 'a' else
       'iidr_az_b_' ~ iidr_env if iidr_dr_target_location == 'b' else
       'iidr_dr_'   ~ iidr_env }}
  become: false
  gather_facts: false

  vars:
    # Units systemctl de IIDR (mismos nombres en todos los nodos/entornos).
    iidr_services:
      - cdc_access_server.service   # Access Server
      - cdc_db2_agent.service       # Motor DB2 z/OS (origen)
      - cdc_kafka_agent.service     # Motor Kafka (destino)

  tasks:

    - name: Validar iidr_dr_target_location
      ansible.builtin.assert:
        that:
          - iidr_dr_target_location in ['a', 'b', 'dr']
        fail_msg: >-
          iidr_dr_target_location debe ser 'a', 'b' o 'dr'
          (recibido: {{ iidr_dr_target_location | default('<undef>') }})
      run_once: true

    # Cada nodo tiene solo el/los unit(s) de su rol. Detectamos cuáles existen
    # para no fallar al arrancar un unit ausente y dejar claro qué se arranca
    # en cada host.
    - name: Detectar qué units cdc_* existen en este nodo
      ansible.builtin.shell:
        cmd: "systemctl list-unit-files '{{ item }}' --no-legend | awk '{print $1}'"
      loop: "{{ iidr_services }}"
      register: _unit_check
      changed_when: false
      failed_when: false
      become: true

    - name: Habilitar y arrancar los units cdc_* presentes
      ansible.builtin.systemd:
        name: "{{ item.item }}"
        state: started
        enabled: true
      become: true
      loop: "{{ _unit_check.results }}"
      loop_control:
        label: "{{ inventory_hostname }} :: {{ item.item }}"
      when: item.stdout | trim | length > 0

    - name: Resumen de arranque en este nodo
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} — units arrancados:
          {{ _unit_check.results | selectattr('stdout', 'truthy')
             | map(attribute='item') | list }}
