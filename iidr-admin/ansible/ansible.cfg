# Config Ansible self-contained para iidr-admin.
# Todo lo de AAP vive bajo iidr-admin/ansible/ para no tocar ogg-ctl ni
# cdc-controller (conviven en el mismo repo). En AAP, el Job Template
# apunta el "playbook directory" a este subdirectorio.
[defaults]
# Playbooks e inventario relativos a este directorio.
inventory = ./inventory
collections_path = ./collections
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False
# Salida legible en los jobs de AAP.
stdout_callback = default
display_skipped_hosts = False
interpreter_python = auto_silent

[inventory]
# No fallar si no hay inventario estático (los playbooks usan localhost).
unparsed_is_failed = False
