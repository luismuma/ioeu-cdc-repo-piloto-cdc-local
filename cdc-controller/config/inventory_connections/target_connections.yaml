---
# Targets connections Inventory
#
# One entry per target system (key = <TARGET_NAME>_<ENV>). Each entry holds the
# infrastructure-level info needed to connect to the target (Confluent Kafka cluster,
# AWS S3 bucket, etc.) — credentials are NOT stored here, only references (aliases)
# to entries in the OGG wallet / external credential store.
# The replication JSON input references one of these entries via the field
# 'target_name' (e.g. "target_name": "KAFKA_GR_DEV"). If absent, a key is derived
# from <PROJECT>_<TARGET_ENGINE>_<ENV>.
#
# 'defaults' values are merged into every entry; per-entry values override the default.

defaults:
  aws_region:                "eu-west-1"
  oauth_endpoint_url:        "https://login.microsoftonline.com/93ad25dd-8cdc-4066-9727-31a8a3024f80/oauth2/v2.0/token"
  initial_load_parallel:     "8"
  initial_load_maxthreads:   "4"


