---
# Databases connections Inventory
#
# One entry per database (key = <bbdd_name>_<env>). Each entry holds both PRIM and STBY
# connection strings (and their OGG credential alias names) plus shared metadata.
# 'defaults' values are merged into every connection entry; per-entry values override the default.

defaults:
  initial_load_parallel: "8"

# ── POC/Development/Integration (DEV) ───────────────────────────────────────────────────────────
# Oracle :
ACNPDB_DEV:
  env:                   "DEV"
  db_engine:             "ORACLE"
  conn_name_prim:        "ACNPDB_PRIM_DEV"
  conn_string_prim:      "(DESCRIPTION=(CONNECT_TIMEOUT=10)(RETRY_COUNT=3)(ADDRESS_LIST=(LOAD_BALANCE=OFF)(FAILOVER=ON)(ADDRESS=(PROTOCOL=TCP)(HOST=cllpre24-scan.es.mapfre.net)(PORT=1534))(ADDRESS=(PROTOCOL=TCP)(HOST=cllpre23-scan.es.mapfre.net)(PORT=1534)))(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME=P_OGG_CPCOPRUM)))"
  conn_name_stby:        "ACNPDB_STBY_DEV"
  conn_string_stby:      "(DESCRIPTION=(CONNECT_TIMEOUT=10)(RETRY_COUNT=3)(ADDRESS_LIST=(LOAD_BALANCE=OFF)(FAILOVER=ON)(ADDRESS=(PROTOCOL=TCP)(HOST=cllpre24-scan.es.mapfre.net)(PORT=1534))(ADDRESS=(PROTOCOL=TCP)(HOST=cllpre23-scan.es.mapfre.net)(PORT=1534)))(CONNECT_DATA=(SERVER=DEDICATED)(SERVICE_NAME=P_OGG_CPCOPRUM_RO)))"
  db_user:               "C##GGADMIN"
  password_credential:   "ORACLE_ACNPDB_GGADMIN"
  pdb:                   "ACNPDB"
  cdc_seq:               "AC"    ## only two characters
  initial_load_parallel: "6"

